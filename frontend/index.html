<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Pinta el tema antes del primer render para que no haya destello.
      (function () {
        try {
          var guardado = localStorage.getItem('caldaw_tema');
          var claro = guardado ? guardado === 'claro'
            : window.matchMedia('(prefers-color-scheme: light)').matches;
          var tema = claro ? 'claro' : 'oscuro';
          document.documentElement.dataset.tema = tema;
          document.documentElement.dataset.estilo = localStorage.getItem('caldaw_estilo') || 'limpio';
          document.documentElement.style.colorScheme = tema === 'claro' ? 'light' : 'dark';
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', tema === 'claro' ? '#f6f5f2' : '#1b1a18');
        } catch (e) { }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Tipografías de los estilos alternativos. Se cargan sin bloquear el
         primer pintado; sin red se usa la del sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <title>Calendario DAW 2º</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
