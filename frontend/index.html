<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Calendario DAW 2º</title>
    <script>
      // Aplica el tema antes del primer pintado para que no parpadee al abrir
      (function () {
        try {
          var guardado = localStorage.getItem('caldaw_tema');
          var claro = guardado ? guardado === 'claro'
            : window.matchMedia('(prefers-color-scheme: light)').matches;
          var tema = claro ? 'claro' : 'oscuro';
          document.documentElement.dataset.tema = tema;
          document.documentElement.style.colorScheme = tema === 'claro' ? 'light' : 'dark';
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', tema === 'claro' ? '#f8fafc' : '#0f172a');
        } catch (e) { }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
